    <script>
        const mountainV3Data = {
            title: "Mountain (Version 3)",
            headings: [
                "Our changing definition of mountains",
                "A sense of achievement",
                "Publicising one's achievements",
                "A disturbing revelation",
                "The wrong priority",
                "A focus on substantiality",
                "A more intimate relationship"
            ],
            paragraphs: [
                {
                    number: 1,
                    correctHeading: "Our changing definition of mountains",
                    meaningVN: "Định nghĩa ngày càng thay đổi của chúng ta về núi non",
                    explanation: "Chọn tiêu đề này vì đoạn văn so sánh cách hiểu về núi xưa và nay: người xưa leo núi vì vẻ đẹp và sự thích thú, còn ngày nay đỉnh núi trở thành đích đến mang tính biểu tượng cho thành công và sức bền.",
                    text: "Even before the nineteenth century, mountains had always exerted a powerful attraction on travellers. They captivated visitors largely because of their natural beauty and the sense of awe inspired by dramatic landscapes. For early explorers, climbing to the summit was primarily about enjoyment and wonder, rather than proving personal strength. In contrast, today the peak is no longer seen merely as a scenic viewpoint but as a highly symbolic destination. Reaching the top has increasingly come to represent success, endurance, and a once-in-a-lifetime accomplishment that many people aspire to achieve."
                },
                {
                    number: 2,
                    correctHeading: "A sense of achievement",
                    meaningVN: "Cảm giác hoàn thành/đạt được",
                    explanation: "Chọn tiêu đề này vì đoạn văn nói việc chinh phục đỉnh núi mang ý nghĩa cá nhân sâu sắc — là ẩn dụ cho thành công, vượt rào cản, khiến cảm giác đạt được rất đáng giá.",
                    text: "For a large number of climbers, conquering a mountain summit embodies profound personal significance. The \"summit\" is often interpreted as a metaphor for success in life, a clear representation of overcoming barriers and pushing human limits. The physical obstacles encountered on the climb mirror psychological struggles, which makes the achievement deeply rewarding. Over time, mountaineering has evolved into a cultural practice where people challenge themselves for adventure, resilience, and self-affirmation. Consequently, the scenery or encounters along the trail have become secondary to the psychological triumph of standing at the very top."
                },
                {
                    number: 3,
                    correctHeading: "Publicising one's achievements",
                    meaningVN: "Công khai thành tích cá nhân",
                    explanation: "Chọn tiêu đề này vì đoạn văn nói về hiện tượng \"summit selfie\": ảnh ở đỉnh từ chỗ để lưu niệm đã thành cách công bố thành tích với người khác, càng mạnh hơn nhờ mạng xã hội.",
                    text: "Mountaineering as a celebrated \"achievement\" has been amplified by the phenomenon of the \"summit selfie.\" Even in the pre-digital era, photographs at the summit were considered valuable mementoes, proof of the effort invested. What began as a way to preserve memories gradually turned into an opportunity to broadcast one's success to others. The rise of social media has intensified this trend, as climbers are often more concerned with curating a perfect image than immersing themselves in the experience. In many cases, the journey itself becomes overshadowed by the simple desire to showcase the fact of having reached the summit."
                },
                {
                    number: 4,
                    correctHeading: "A disturbing revelation",
                    meaningVN: "Một sự thật đáng lo ngại được tiết lộ",
                    explanation: "Chọn tiêu đề này vì đoạn văn kể bức ảnh của Thomas năm 1993 phơi bày \"the unsettling reality\" — hàng trăm người xếp hàng một chờ lên đỉnh, gương mặt kiệt sức và bức xúc. Cụm \"unsettling reality\" chính là \"a disturbing revelation\".",
                    text: "The photograph captured by Thomas in 1993 exposed the unsettling reality of contemporary mountaineering. It depicted hundreds of people queuing in a single file line to reach the summit - an image that contrasts starkly with the solitude once associated with genuine exploration. The climbers' expressions reflected exhaustion and frustration rather than determination or joy, suggesting that the climb had lost its authenticity. Once published online, the image provoked widespread debate about whether the meaning of summiting had been reduced to mere spectacle. For many critics, it illustrated how the essence of mountaineering has been compromised by mass participation and social validation."
                },
                {
                    number: 5,
                    correctHeading: "The wrong priority",
                    meaningVN: "Ưu tiên sai lầm",
                    explanation: "Chọn tiêu đề này vì đoạn văn nói giới phê bình kết luận đỉnh núi đã thành mục đích tự thân, người leo coi nhẹ quá trình và khâu chuẩn bị, chạy theo danh tiếng — tức đặt sai thứ tự ưu tiên.",
                    text: "From this picture, critics conclude that the summit has become an end in itself, often detached from the original spirit of exploration. Many people now seem to disregard the multifaceted nature of mountaineering, treating it simply as a fashionable objective. For some, neither the genuine process of climbing nor the authentic arrival at the peak matters, as their motivation is largely external. Furthermore, the preparation that should accompany such an endeavour - rigorous physical training, budgeting, and logistical planning - is frequently underestimated. As a result, the experience risks being superficial, emphasising prestige rather than true engagement with the mountain."
                },
                {
                    number: 6,
                    correctHeading: "A focus on substantiality",
                    meaningVN: "Tập trung vào tính bền vững",
                    explanation: "Chọn tiêu đề này vì đoạn văn nói trực tiếp về trách nhiệm và tính bền vững: rác thải, suy thoái môi trường, thiếu tôn trọng hệ sinh thái địa phương.",
                    text: "One of the most urgent debates surrounding contemporary mountaineering concerns sustainability. Popular climbing destinations often suffer from waste accumulation, environmental degradation, and disrespect for local ecosystems. Many activists argue that this trend-driven approach to climbing must be reconsidered in order to preserve fragile landscapes. Responsibility, they emphasise, should be integral to every stage of the climbing journey, from preparation to leaving the site clean. Ultimately, they believe that the summit can only be considered \"worthwhile\" if the path toward it contributes positively to both the environment and the climber's personal growth."
                },
                {
                    number: 7,
                    correctHeading: "A more intimate relationship",
                    meaningVN: "Một mối quan hệ gắn bó mật thiết hơn",
                    explanation: "Chọn tiêu đề này vì đoạn văn kêu gọi quay về gốc rễ đích thực: tận hưởng việc đi bộ, quan sát, chậm lại; tự truyện của Cherke cho thấy leo núi đem lại mối liên hệ gần gũi hơn với thiên nhiên.",
                    text: "Perhaps the time has come to reassess our perspective on climbing and return to its more authentic roots. Instead of pursuing mountains solely for recognition, individuals could rediscover the joy of walking, observing, and slowing down. In her autobiography, Cherke described how hiking offered her moments of reflection and a deeper connection with the natural world. Such experiences remind us that mountains provide not only physical challenges but also opportunities for serenity and contemplation. By cultivating a more intimate relationship with nature, climbing may once again regain its balance between personal fulfilment and environmental respect."
                }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            const container = document.getElementById('paragraphs-container');
            const checkBtn = document.getElementById('check-answers-btn');
            const showExplanationsBtn = document.getElementById('show-explanations-btn');
            const resetBtn = document.getElementById('reset-btn');
            const scoreBox = document.getElementById('score-box');
            const scoreText = document.getElementById('score-text');
            const userSelections = {};

            mountainV3Data.paragraphs.forEach((p) => {
                const card = document.createElement('div');
                card.className = 'paragraph-card';
                card.id = `para-card-${p.number}`;

                let optionsHtml = '';
                mountainV3Data.headings.forEach(h => {
                    optionsHtml += `<div class="custom-option" data-value="${h}">${h}</div>`;
                });

                card.innerHTML = `
                    <div class="paragraph-index">${p.number}.</div>
                    <div class="paragraph-body">
                        <div class="custom-select-wrapper" id="select-wrapper-${p.number}">
                            <div class="custom-select-trigger" id="select-trigger-${p.number}">
                                <span class="selected-value-text">Choose a heading...</span>
                                <i class="fas fa-chevron-down chevron-icon"></i>
                            </div>
                            <div class="custom-options-list">
                                ${optionsHtml}
                            </div>
                        </div>

                        <div class="correct-answer-hint" id="hint-${p.number}">
                            <i class="fas fa-check-circle"></i>
                            <span class="hint-text">${p.correctHeading} (${p.meaningVN})</span>
                        </div>

                        <div class="explanation-card" id="explanation-${p.number}">
                            <div class="explanation-title">💡 Giải nghĩa: ${p.meaningVN}</div>
                            <div>${p.explanation}</div>
                        </div>

                        <div class="passage-paragraph-text">
                            ${p.text}
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });

            document.querySelectorAll('.custom-select-trigger').forEach(trigger => {
                trigger.addEventListener('click', function (e) {
                    e.stopPropagation();
                    const wrapper = this.closest('.custom-select-wrapper');
                    const isOpen = wrapper.classList.contains('open');

                    document.querySelectorAll('.custom-select-wrapper.open').forEach(w => {
                        if (w !== wrapper) w.classList.remove('open');
                    });

                    wrapper.classList.toggle('open', !isOpen);
                });
            });

            document.querySelectorAll('.custom-option').forEach(option => {
                option.addEventListener('click', function (e) {
                    e.stopPropagation();
                    const wrapper = this.closest('.custom-select-wrapper');
                    const paraNum = wrapper.id.replace('select-wrapper-', '');
                    const selectedVal = this.dataset.value;

                    wrapper.querySelector('.selected-value-text').textContent = selectedVal;
                    wrapper.querySelectorAll('.custom-option').forEach(opt => opt.classList.remove('selected'));
                    this.classList.add('selected');

                    userSelections[paraNum] = selectedVal;
                    wrapper.classList.remove('open');

                    wrapper.classList.remove('is-correct', 'is-incorrect');
                    document.getElementById(`hint-${paraNum}`).classList.remove('visible');
                    document.getElementById(`explanation-${paraNum}`).classList.remove('visible');
                });
            });

            document.addEventListener('click', function () {
                document.querySelectorAll('.custom-select-wrapper.open').forEach(w => {
                    w.classList.remove('open');
                });
            });

            function checkAnswers() {
                let correctCount = 0;
                mountainV3Data.paragraphs.forEach(p => {
                    const wrapper = document.getElementById(`select-wrapper-${p.number}`);
                    const hintDiv = document.getElementById(`hint-${p.number}`);
                    const expDiv = document.getElementById(`explanation-${p.number}`);
                    const userVal = userSelections[p.number];

                    wrapper.classList.remove('is-correct', 'is-incorrect');
                    hintDiv.classList.remove('visible');
                    expDiv.classList.remove('visible');

                    if (userVal === p.correctHeading) {
                        correctCount++;
                        wrapper.classList.add('is-correct');
                        expDiv.classList.add('visible');
                    } else {
                        wrapper.classList.add('is-incorrect');
                        hintDiv.classList.add('visible');
                        expDiv.classList.add('visible');
                    }
                });

                scoreBox.style.display = 'flex';
                scoreText.textContent = `${correctCount} / ${mountainV3Data.paragraphs.length}`;
            }

            function showAllExplanations() {
                mountainV3Data.paragraphs.forEach(p => {
                    const wrapper = document.getElementById(`select-wrapper-${p.number}`);
                    const triggerText = wrapper.querySelector('.selected-value-text');
                    const hintDiv = document.getElementById(`hint-${p.number}`);
                    const expDiv = document.getElementById(`explanation-${p.number}`);

                    triggerText.textContent = p.correctHeading;
                    wrapper.classList.remove('is-incorrect');
                    wrapper.classList.add('is-correct');
                    hintDiv.classList.remove('visible');
                    expDiv.classList.add('visible');
                    userSelections[p.number] = p.correctHeading;
                });

                scoreBox.style.display = 'flex';
                scoreText.textContent = `7 / 7 (Đã mở đáp án)`;
            }

            function resetQuiz() {
                mountainV3Data.paragraphs.forEach(p => {
                    const wrapper = document.getElementById(`select-wrapper-${p.number}`);
                    wrapper.querySelector('.selected-value-text').textContent = "Choose a heading...";
                    wrapper.classList.remove('is-correct', 'is-incorrect', 'open');
                    wrapper.querySelectorAll('.custom-option').forEach(opt => opt.classList.remove('selected'));
                    document.getElementById(`hint-${p.number}`).classList.remove('visible');
                    document.getElementById(`explanation-${p.number}`).classList.remove('visible');
                    delete userSelections[p.number];
                });

                scoreBox.style.display = 'none';
                resetTimer();
            }

            checkBtn.addEventListener('click', checkAnswers);
            showExplanationsBtn.addEventListener('click', showAllExplanations);
            resetBtn.addEventListener('click', resetQuiz);

            let totalSeconds = 8 * 60 + 3;
            let isPaused = false;
            let timerInterval;

            const timerDisplay = document.getElementById('timer-display');
            const pauseBtn = document.getElementById('pause-btn');
            const pauseIcon = document.getElementById('pause-icon');
            const bookmarkBtn = document.getElementById('bookmark-btn');
            const bookmarkIcon = document.getElementById('bookmark-icon');

            function formatTime(sec) {
                const m = Math.floor(sec / 60);
                const s = sec % 60;
                return `00:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }

            function startTimer() {
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    if (!isPaused && totalSeconds > 0) {
                        totalSeconds--;
                        timerDisplay.textContent = formatTime(totalSeconds);
                        if (totalSeconds <= 0) {
                            clearInterval(timerInterval);
                            alert('Hết giờ làm bài!');
                            checkAnswers();
                        }
                    }
                }, 1000);
            }

            function resetTimer() {
                totalSeconds = 8 * 60 + 3;
                isPaused = false;
                pauseIcon.className = 'fas fa-pause';
                timerDisplay.textContent = formatTime(totalSeconds);
                startTimer();
            }

            pauseBtn.addEventListener('click', () => {
                isPaused = !isPaused;
                pauseIcon.className = isPaused ? 'fas fa-play' : 'fas fa-pause';
            });

            bookmarkBtn.addEventListener('click', () => {
                bookmarkBtn.classList.toggle('bookmarked');
                bookmarkIcon.className = bookmarkBtn.classList.contains('bookmarked') ? 'fas fa-bookmark' : 'far fa-bookmark';
            });

            startTimer();
        });
    </script>
</body>
</html>
