    <script>
        // Dữ liệu Mountain (Version 5)
        const mountainV5Data = {
            title: "Mountain (Version 5)",
            headings: [
                "Our changing perspective towards mountains",
                "A unique sense of achievement",
                "Publicising one's achievements",
                "The wrong priority",
                "A disturbing revelation",
                "A focus on sustainability",
                "A more intimate relationship"
            ],
            paragraphs: [
                {
                    number: 1,
                    correctHeading: "Our changing perspective towards mountains",
                    meaningVN: "Cách nhìn nhận của chúng ta về núi thay đổi",
                    explanation: "Chọn \"Our changing perspective towards mountains\" vì đoạn văn so sánh xưa – nay: người ta từng nghĩ leo núi là thú chơi hẹp, nhưng có bằng chứng leo núi đã là môn thể thao nghiêm túc từ lâu; điều KHÁC biệt bây giờ là định nghĩa \"chinh phục\" = đứng trên đỉnh, tự mình nhìn xuống thay vì nhờ ảnh và lời kể của người khác.",
                    text: "It's often thought that mountaineering has never attracted much serious attention - a niche pursuit that only became popular once modern equipment made the peaks accessible. There is clear evidence, however, that people were treating climbing as a demanding sport long before the era of social media. What is different in modern times is that many people now define conquering a mountain as standing on its summit - the particular thrill of being on top of the very thing you have just overcome, with the whole landscape spread out below, rather than relying on the photographs and accounts that other climbers have provided."
                },
                {
                    number: 2,
                    correctHeading: "A unique sense of achievement",
                    meaningVN: "Cảm giác thành tựu độc đáo",
                    explanation: "Chọn \"A unique sense of achievement\" vì đoạn văn nói về cảm giác thành tựu sâu sắc (profound sense of accomplishment): hình dáng núi tượng trưng cho chinh phục, vượt nỗi sợ, đẩy giới hạn, cộng thêm adrenaline khiến người leo quay lại mãi.",
                    text: "Climbing a mountain often leads to a profound sense of accomplishment. Because of their very shape, rising steeply to a single point, mountains stand for conquest and struggle, and reaching the top of one carries that meaning with it. But there is more to it than that: it represents not just reaching a physical summit but also conquering personal fears and pushing one's limits, creating memories that last a lifetime. There is also the adrenaline rush that comes with it - the same surge of excitement that draws people to other adventure sports, and one reason why so many climbers return to the mountains long after they have proved whatever they set out to prove."
                },
                {
                    number: 3,
                    correctHeading: "Publicising one's achievements",
                    meaningVN: "Công bố thành tích của bản thân",
                    explanation: "Chọn \"Publicising one's achievements\" vì đoạn văn nói selfie trên đỉnh gần như bắt buộc — bằng chứng và cách để mọi người biết; sự thoả mãn riêng tư giờ được đăng, gắn giờ, chia sẻ (posted, timestamped and shared).",
                    text: "Reaching the summit is no longer enough on its own. Taking a selfie at the top has become almost obligatory - the proof that the climb actually happened, and the means by which everyone else gets to hear about it. What was once a private satisfaction is now something to be posted, timestamped and shared within hours of the descent. This turns personal milestones into public spectacles that can inspire others, though it also raises awkward questions about authenticity: whether the climb was made for its own sake, or for the picture at the end of it."
                },
                {
                    number: 4,
                    correctHeading: "The wrong priority",
                    meaningVN: "Ưu tiên sai lầm",
                    explanation: "Chọn \"The wrong priority\" vì đoạn văn chỉ ra người leo tập trung vào bức ảnh hơn ngọn núi, coi hành trình chỉ là chướng ngại, bỏ qua cảnh báo → tai nạn; \"personal image ends up mattering more than safety or responsibility\" = đặt sai ưu tiên.",
                    text: "In recent years, some climbers have become more focused on the photograph than on the mountain itself. Only the summit seems to count, as if there were nothing beautiful about the journey up, as if the hours of effort and the shifting landscape were merely an obstacle between the climber and the picture. Warnings go unheeded because nobody wants to turn back empty-handed, and in some cases this obsession with online fame has led to serious accidents. Reaching a major peak now also demands complicated organisation - permits, guides, bottled oxygen, a support team booked months in advance - and all of this can detract from the enjoyment of the climb. Personal image ends up mattering more than safety or responsibility."
                },
                {
                    number: 5,
                    correctHeading: "A disturbing revelation",
                    meaningVN: "Một sự thật đáng lo ngại",
                    explanation: "Chọn \"A disturbing revelation\" vì đoạn văn mở bằng kỳ vọng Everest vắng vẻ rồi lật lại \"The reality is startling\": ảnh \"traffic jam\" trên death zone, rác mỗi mùa, thử thách cá nhân thành cuộc đua thương mại. Bẫy: đoạn 4 cũng nói tai nạn nhưng không \"hé lộ\" sự thật gây sốc.",
                    text: "You might expect the world's highest mountain to be an empty place - so hostile, so far beyond ordinary human endurance that hardly anyone would set foot there. The reality is startling. Photographs from recent seasons show a \"traffic jam\" of climbers on Everest, queuing along a single fixed rope in the death zone, waiting hours for their turn at the top. When a weather window opens, the ascent effectively becomes a race between them, the other climbers and the weather itself. Meanwhile the slopes carry the waste of every season, and what was once a personal challenge has become a commercial race measured in photographs and fame rather than respect for the mountain."
                },
                {
                    number: 6,
                    correctHeading: "A focus on sustainability",
                    meaningVN: "Tập trung vào sự bền vững",
                    explanation: "Chọn \"A focus on sustainability\" vì đoạn văn nói về cách vận hành expedition đổi theo hướng bảo vệ môi trường: giới hạn permit, đặt cọc trả lại khi mang rác xuống, clean-up climbs, \"a mountain should be left cleaner than it was found\".",
                    text: "The pressure on high-altitude environments has forced a change in how expeditions are run. Authorities in several climbing regions now issue only a limited number of permits each season, and operators are required to lodge a deposit that is returned only once they bring their rubbish back down with them. Some teams organise clean-up climbs, whose purpose is not the summit at all but the removal of equipment and waste abandoned by earlier parties. Behind these measures lies a shift in what counts as a successful trip: protecting the slopes now matters as much as standing on top of them, and a mountain should be left cleaner than it was found."
                },
                {
                    number: 7,
                    correctHeading: "A more intimate relationship",
                    meaningVN: "Một mối quan hệ gắn bó hơn",
                    explanation: "Chọn \"A more intimate relationship\" vì đoạn văn kể Nan Shepherd đi \"into the hills rather than up them\", biết núi như biết một người bạn — \"one visits a friend with no intention but to be with him\".",
                    tip: "👉 Mẹo: đọc câu đầu + câu cuối mỗi đoạn; các cặp dễ nhầm là đoạn 3/4 (đăng ảnh vs ưu tiên sai) và đoạn 4/5 (tai nạn vs sự thật gây sốc ở Everest).",
                    text: "For most people a mountain is something to be conquered - a summit to be reached, a target to be ticked off. The Scottish writer Nan Shepherd saw it differently. She grew up within sight of the Cairngorms and spent a lifetime walking the same range, setting down what she found there in The Living Mountain. She went into the hills rather than up them, returning to the same corries and burns until she knew them the way one comes to know a person rather than a place: to be with the mountain as “one visits a friend with no intention but to be with him”."
                }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            const container = document.getElementById('paragraphs-container');
            const checkBtn = document.getElementById('check-answers-btn');
            const showExplanationsBtn = document.getElementById('show-explanations-btn');
            const resetBtn = document.getElementById('reset-btn');
            const scoreBox = document.getElementById('score-box');
            const scoreText = document.getElementById('score-text');

            const userSelections = {};

            mountainV5Data.paragraphs.forEach((p) => {
                const card = document.createElement('div');
                card.className = 'paragraph-card';
                card.id = `para-card-${p.number}`;

                let optionsHtml = '';
                mountainV5Data.headings.forEach(h => {
                    optionsHtml += `<div class="custom-option" data-value="${h}">${h}</div>`;
                });

                card.innerHTML = `
                    <div class="paragraph-index">${p.number}.</div>
                    <div class="paragraph-body">
                        <div class="custom-select-wrapper" id="select-wrapper-${p.number}">
                            <div class="custom-select-trigger" id="select-trigger-${p.number}">
                                <span class="selected-value-text">Choose a heading...</span>
                                <i class="fas fa-chevron-down chevron-icon"></i>
                            </div>
                            <div class="custom-options-list">
                                ${optionsHtml}
                            </div>
                        </div>

                        <!-- Gợi ý đáp án đúng khi sai -->
                        <div class="correct-answer-hint" id="hint-${p.number}">
                            <i class="fas fa-check-circle"></i>
                            <span class="hint-text">${p.correctHeading} (${p.meaningVN})</span>
                        </div>

                        <!-- Hộp giải thích chi tiết tiếng Việt -->
                        <div class="explanation-card" id="explanation-${p.number}">
                            <div class="explanation-title">💡 Giải nghĩa: ${p.meaningVN}</div>
                            <div>${p.explanation}</div>
                            ${p.tip ? `<div class="tip-box">${p.tip}</div>` : ''}
                        </div>

                        <!-- Nội dung đoạn văn -->
                        <div class="passage-paragraph-text">
                            ${p.text}
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });

            // Xử lý Custom Select Dropdown
            document.querySelectorAll('.custom-select-trigger').forEach(trigger => {
                trigger.addEventListener('click', function (e) {
                    e.stopPropagation();
                    const wrapper = this.closest('.custom-select-wrapper');
                    const isOpen = wrapper.classList.contains('open');

                    document.querySelectorAll('.custom-select-wrapper.open').forEach(w => {
                        if (w !== wrapper) w.classList.remove('open');
                    });

                    wrapper.classList.toggle('open', !isOpen);
                });
            });

            document.querySelectorAll('.custom-option').forEach(option => {
                option.addEventListener('click', function (e) {
                    e.stopPropagation();
                    const wrapper = this.closest('.custom-select-wrapper');
                    const paraNum = wrapper.id.replace('select-wrapper-', '');
                    const selectedVal = this.dataset.value;

                    wrapper.querySelector('.selected-value-text').textContent = selectedVal;
                    wrapper.querySelectorAll('.custom-option').forEach(opt => opt.classList.remove('selected'));
                    this.classList.add('selected');

                    userSelections[paraNum] = selectedVal;
                    wrapper.classList.remove('open');

                    // Reset trạng thái
                    wrapper.classList.remove('is-correct', 'is-incorrect');
                    document.getElementById(`hint-${paraNum}`).classList.remove('visible');
                    document.getElementById(`explanation-${paraNum}`).classList.remove('visible');
                });
            });

            document.addEventListener('click', function () {
                document.querySelectorAll('.custom-select-wrapper.open').forEach(w => {
                    w.classList.remove('open');
                });
            });

            // Nút kiểm tra đáp án
            function checkAnswers() {
                let correctCount = 0;

                mountainV5Data.paragraphs.forEach(p => {
                    const wrapper = document.getElementById(`select-wrapper-${p.number}`);
                    const hintDiv = document.getElementById(`hint-${p.number}`);
                    const expDiv = document.getElementById(`explanation-${p.number}`);
                    const userVal = userSelections[p.number];

                    wrapper.classList.remove('is-correct', 'is-incorrect');
                    hintDiv.classList.remove('visible');
                    expDiv.classList.remove('visible');

                    if (userVal === p.correctHeading) {
                        correctCount++;
                        wrapper.classList.add('is-correct');
                        expDiv.classList.add('visible');
                    } else {
                        wrapper.classList.add('is-incorrect');
                        hintDiv.classList.add('visible');
                        expDiv.classList.add('visible');
                    }
                });

                scoreBox.style.display = 'flex';
                scoreText.textContent = `${correctCount} / ${mountainV5Data.paragraphs.length}`;
            }

            // Hiển thị toàn bộ đáp án
            function showAllExplanations() {
                mountainV5Data.paragraphs.forEach(p => {
                    const wrapper = document.getElementById(`select-wrapper-${p.number}`);
                    const triggerText = wrapper.querySelector('.selected-value-text');
                    const hintDiv = document.getElementById(`hint-${p.number}`);
                    const expDiv = document.getElementById(`explanation-${p.number}`);

                    triggerText.textContent = p.correctHeading;
                    wrapper.classList.remove('is-incorrect');
                    wrapper.classList.add('is-correct');
                    hintDiv.classList.remove('visible');
                    expDiv.classList.add('visible');
                    userSelections[p.number] = p.correctHeading;
                });

                scoreBox.style.display = 'flex';
                scoreText.textContent = `7 / 7 (Đã mở đáp án)`;
            }

            // Làm lại
            function resetQuiz() {
                mountainV5Data.paragraphs.forEach(p => {
                    const wrapper = document.getElementById(`select-wrapper-${p.number}`);
                    const triggerText = wrapper.querySelector('.selected-value-text');
                    const hintDiv = document.getElementById(`hint-${p.number}`);
                    const expDiv = document.getElementById(`explanation-${p.number}`);

                    triggerText.textContent = "Choose a heading...";
                    wrapper.classList.remove('is-correct', 'is-incorrect', 'open');
                    wrapper.querySelectorAll('.custom-option').forEach(opt => opt.classList.remove('selected'));
                    hintDiv.classList.remove('visible');
                    expDiv.classList.remove('visible');
                    delete userSelections[p.number];
                });

                scoreBox.style.display = 'none';
                resetTimer();
            }

            checkBtn.addEventListener('click', checkAnswers);
            showExplanationsBtn.addEventListener('click', showAllExplanations);
            resetBtn.addEventListener('click', resetQuiz);

            // Timer (08:03)
            let totalSeconds = 8 * 60 + 3;
            let isPaused = false;
            let timerInterval;

            const timerDisplay = document.getElementById('timer-display');
            const pauseBtn = document.getElementById('pause-btn');
            const pauseIcon = document.getElementById('pause-icon');
            const bookmarkBtn = document.getElementById('bookmark-btn');
            const bookmarkIcon = document.getElementById('bookmark-icon');

            function formatTime(sec) {
                const m = Math.floor(sec / 60);
                const s = sec % 60;
                return `00:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }

            function startTimer() {
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    if (!isPaused && totalSeconds > 0) {
                        totalSeconds--;
                        timerDisplay.textContent = formatTime(totalSeconds);
                        if (totalSeconds <= 0) {
                            clearInterval(timerInterval);
                            alert('Hết giờ làm bài!');
                            checkAnswers();
                        }
                    }
                }, 1000);
            }

            function resetTimer() {
                totalSeconds = 8 * 60 + 3;
                isPaused = false;
                pauseIcon.className = 'fas fa-pause';
                timerDisplay.textContent = formatTime(totalSeconds);
                startTimer();
            }

            pauseBtn.addEventListener('click', () => {
                isPaused = !isPaused;
                pauseIcon.className = isPaused ? 'fas fa-play' : 'fas fa-pause';
            });

            bookmarkBtn.addEventListener('click', () => {
                bookmarkBtn.classList.toggle('bookmarked');
                bookmarkIcon.className = bookmarkBtn.classList.contains('bookmarked') ? 'fas fa-bookmark' : 'far fa-bookmark';
            });

            startTimer();
        });
    </script>
</body>
</html>
