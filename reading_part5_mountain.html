        .timer-display {

        /* Container nội dung bài thi */
        .exam-container {
            max-width: 1100px;

            padding: 0 20px;
        }

        /* Hộp hướng dẫn (giống ảnh) */
        .instruction-box {
            background: #fff;

        /* Thẻ đoạn văn (Paragraph Card) */
        .paragraph-card {
            background: #fff;

        /* Custom Dropdown Container */
        .custom-select-wrapper {
            position: relative;
            width: fit-content;
            max-width: 100%;
            min-width: 320px;
            margin-bottom: 6px;
        }

        .custom-select-trigger {
            border: 1.5px solid #d1d5db;
            border-radius: 22px;
            padding: 9px 20px;
            background: #fff;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            gap: 16px;
            user-select: none;
            transition: all 0.2s ease;
        }

        .custom-select-trigger:hover {
            border-color: #9ca3af;
        }

        .custom-select-trigger .chevron-icon {
            font-size: 12px;
            color: #6b7280;
            transition: transform 0.2s ease;
        }

        /* Trạng thái dropdown mở */
        .custom-select-wrapper.open .custom-select-trigger {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .custom-select-wrapper.open .chevron-icon {
            transform: rotate(180deg);
        }

        /* Dropdown options list (nổi lên trên) */
        .custom-options-list {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            min-width: 350px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            z-index: 100;
            overflow: hidden;
            display: none;
        }

        .custom-select-wrapper.open .custom-options-list {
            display: block;
            animation: fadeInOptions 0.15s ease-out;
        }

        @keyframes fadeInOptions {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .custom-option {
            padding: 11px 18px;
            font-size: 14px;
            color: #374151;
            cursor: pointer;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .custom-option:hover {
            background-color: #f3f4f6;
            color: #111827;
        }

        .custom-option.selected {
            background-color: #eff6ff;
            color: #1d4ed8;
            font-weight: 600;

        /* Trạng thái đúng / sai (Match màu xanh / đỏ trong ảnh) */

            border-color: #10b981 !important;
            color: #047857 !important;
            font-weight: 600;
            background-color: #f0fdf4;
        }

        .custom-select-wrapper.is-correct .chevron-icon {
            color: #10b981 !important;
        }

        .custom-select-wrapper.is-incorrect .custom-select-trigger {
            border-color: #ef4444 !important;
            color: #b91c1c !important;
            font-weight: 600;
            background-color: #fef2f2;
        }

        .custom-select-wrapper.is-incorrect .chevron-icon {
            color: #ef4444 !important;
        }

        /* Dòng đáp án đúng màu xanh khi trả lời sai (giống hình 2) */
        .correct-answer-hint {

        .explanation-card {
            display: none;
            background-color: #eff6ff;

        @media (max-width: 768px) {

<body>

    <script>
        // Dữ liệu 7 đoạn văn và 7 tiêu đề tương ứng (kèm giải thích chi tiết)
        const mountainData = {
            title: "Mountain (Version 2)",
            headings: [
                "Changing the perspective towards mountain",
                "A disturbing revelation",
                "A more intimate relationship",
                "The wrong priority",
                "Publicity of achievement",
                "Unique sense of achievement",
                "Focus on sustainability"
            ],
            paragraphs: [
                {
                    number: 1,
                    correctHeading: "Changing the perspective towards mountain",
                    explanation: "Chọn tiêu đề này vì đoạn văn nói khái niệm \"mountain\" đã thay đổi theo thời gian: trước thế kỷ 19 người ta ngại chinh phục, nay công nghệ giúp việc leo núi dễ hơn và núi mang ý nghĩa biểu tượng cho thử thách, phiêu lưu.",
                    text: "The term \"mountain\" has evolved over time, reflecting not only physical characteristics but also cultural significance. Before the 19th century, people were quite shy when it came to conquering mountains. Today, with the development of technology, reaching the highest peaks has become easier. In contemporary discussions, mountains may symbolize challenges to overcome or destinations for adventure, transcending their geographical attributes."
                },
                {
                    number: 2,
                    correctHeading: "Unique sense of achievement",
                    explanation: "Chọn tiêu đề này vì đoạn văn nhấn mạnh cảm giác thành tựu rất riêng khi leo núi: vượt qua nỗi sợ, đẩy giới hạn bản thân, và adrenaline tạo cảm giác hưng phấn như các môn thể thao mạo hiểm khác.",
                    text: "Climbing a mountain often leads to a profound sense of accomplishment. It represents not just reaching a physical summit but also conquering personal fears and pushing one's limits, creating memories that last a lifetime. Besides, mountain climbing also creates Adrenaline - a hormone that creates a feeling of excitement like when playing other adventure sports."
                },
                {
                    number: 3,
                    correctHeading: "Publicity of achievement",
                    explanation: "Chọn tiêu đề này vì đoạn văn nói trong thời đại số, thành tích leo núi được chia sẻ rộng rãi trên mạng xã hội, biến cột mốc cá nhân thành sự kiện công khai (public spectacles).",
                    text: "In today's digital age, sharing achievements has become prevalent. Climbing a mountain is frequently documented on social media, turning personal milestones into public spectacles that inspire others while also raising questions about authenticity."
                },
                {
                    number: 4,
                    correctHeading: "The wrong priority",
                    explanation: "Chọn tiêu đề này vì đoạn văn chỉ ra người leo núi đặt sai thứ tự ưu tiên: quan tâm chụp ảnh cho mạng xã hội hơn là tôn trọng núi, bỏ qua cảnh báo thời tiết và an toàn, dẫn tới tai nạn.",
                    text: "In recent years, some climbers have become more focused on taking photos for social media than respecting the mountains they visit. Long lines form near popular summits as people wait for the perfect picture, often ignoring weather warnings or safety advice. In some cases, this obsession with online fame has led to serious accidents. It shows how personal image is sometimes valued more than safety or responsibility."
                },
                {
                    number: 5,
                    correctHeading: "A disturbing revelation",
                    explanation: "Chọn tiêu đề này vì đoạn văn phơi bày sự thật đáng lo ở Everest: dòng người chen chúc, rác thải và ô nhiễm, thử thách cá nhân biến thành cuộc đua thương mại — tác giả dùng chính từ \"disturbing\".",
                    text: "Mount Everest, once a symbol of human courage, has now become a worrying example of how adventure can harm nature. Every climbing season, long lines of climbers crowd the narrow paths to the summit, leaving behind waste and pollution on the fragile slopes. What used to be a personal challenge has turned into a commercial race, where success is measured by photos and fame rather than respect for the mountain. This situation is disturbing because it shows how our desire to conquer the world's highest peak has created serious environmental and moral concerns."
                },
                {
                    number: 6,
                    correctHeading: "Focus on sustainability",
                    explanation: "Chọn tiêu đề này vì đoạn văn tập trung vào tính bền vững: quy định quản lý rác nghiêm hơn, giới hạn số đoàn leo, các chuyến \"clean-up climbs\" để dọn rác trên núi.",
                    text: "As the number of climbers on Mount Everest continues to rise, the need to focus on sustainability has become urgent. Local authorities and environmental groups are now introducing stricter waste management rules, encouraging climbers to bring back what they carry, and limiting the number of expeditions each season. Some teams have even started \"clean-up climbs\" to remove rubbish left behind on the slopes. These efforts remind us that protecting the mountain is just as important as reaching its peak. True success on Everest should mean leaving the mountain cleaner and safer for future generations."
                },
                {
                    number: 7,
                    correctHeading: "A more intimate relationship",
                    explanation: "Chọn tiêu đề này vì đoạn văn nói trải nghiệm cùng nhau trong môi trường thử thách giúp các cặp đôi hoặc bạn bè gắn bó thân thiết hơn nhờ hỗ trợ và hiểu nhau.",
                    text: "Shared experiences in challenging environments, like mountains, can deepen intimacy in relationships. Couples or friends who navigate the challenges of climbing together often find their bonds strengthened through mutual support and understanding."
                }
            ]
        };

        document.addEventListener('DOMContentLoaded', function () {
            const container = document.getElementById('paragraphs-container');
            const checkBtn = document.getElementById('check-answers-btn');
            const showExplanationsBtn = document.getElementById('show-explanations-btn');
            const resetBtn = document.getElementById('reset-btn');
            const scoreBox = document.getElementById('score-box');
            const scoreText = document.getElementById('score-text');

            // Lưu trữ lựa chọn của người dùng { 1: "...", 2: "..." }
            const userSelections = {};

            // Render 7 đoạn văn
            mountainData.paragraphs.forEach((p) => {
                const card = document.createElement('div');
                card.className = 'paragraph-card';
                card.id = `para-card-${p.number}`;

                let optionsHtml = '';
                mountainData.headings.forEach(h => {
                    optionsHtml += `<div class="custom-option" data-value="${h}">${h}</div>`;
                });

                card.innerHTML = `
                    <div class="paragraph-index">${p.number}.</div>
                    <div class="paragraph-body">
                        <div class="custom-select-wrapper" id="select-wrapper-${p.number}">
                            <div class="custom-select-trigger" id="select-trigger-${p.number}">
                                <span class="selected-value-text">Choose a heading...</span>
                                <i class="fas fa-chevron-down chevron-icon"></i>
                            </div>
                            <div class="custom-options-list">
                                ${optionsHtml}
                            </div>
                        </div>

                        <!-- Gợi ý đáp án đúng khi sai -->
                        <div class="correct-answer-hint" id="hint-${p.number}">
                            <i class="fas fa-check-circle"></i>
                            <span class="hint-text">${p.correctHeading}</span>
                        </div>

                        <!-- Hộp giải thích chi tiết tiếng Việt -->
                        <div class="explanation-card" id="explanation-${p.number}">
                            ${p.explanation}
                        </div>

                        <!-- Nội dung đoạn văn -->
                        <div class="passage-paragraph-text">
                            ${p.text}
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });

            // Xử lý đóng/mở custom dropdown
            document.querySelectorAll('.custom-select-trigger').forEach(trigger => {
                trigger.addEventListener('click', function (e) {
                    e.stopPropagation();
                    const wrapper = this.closest('.custom-select-wrapper');
                    const isOpen = wrapper.classList.contains('open');

                    // Đóng tất cả dropdown khác
                    document.querySelectorAll('.custom-select-wrapper.open').forEach(w => {
                        if (w !== wrapper) w.classList.remove('open');
                    });

                    // Bật/tắt dropdown hiện tại
                    wrapper.classList.toggle('open', !isOpen);
                });
            });

            // Chọn option trong dropdown
            document.querySelectorAll('.custom-option').forEach(option => {
                option.addEventListener('click', function (e) {
                    e.stopPropagation();
                    const wrapper = this.closest('.custom-select-wrapper');
                    const paraNum = wrapper.id.replace('select-wrapper-', '');
                    const selectedVal = this.dataset.value;

                    // Cập nhật text hiển thị
                    const triggerText = wrapper.querySelector('.selected-value-text');
                    triggerText.textContent = selectedVal;

                    // Cập nhật class selected cho option
                    wrapper.querySelectorAll('.custom-option').forEach(opt => opt.classList.remove('selected'));
                    this.classList.add('selected');

                    // Lưu vào biến
                    userSelections[paraNum] = selectedVal;

                    // Đóng dropdown
                    wrapper.classList.remove('open');

                    // Reset trạng thái kiểm tra của đoạn này khi đổi đáp án
                    wrapper.classList.remove('is-correct', 'is-incorrect');
                    document.getElementById(`hint-${paraNum}`).classList.remove('visible');
                    document.getElementById(`explanation-${paraNum}`).classList.remove('visible');
                });
            });

            // Đóng dropdown khi click ra ngoài
            document.addEventListener('click', function () {
                document.querySelectorAll('.custom-select-wrapper.open').forEach(w => {
                    w.classList.remove('open');
                });
            });

            // Hàm kiểm tra đáp án
            function checkAnswers() {
                let correctCount = 0;

                mountainData.paragraphs.forEach(p => {
                    const wrapper = document.getElementById(`select-wrapper-${p.number}`);
                    const hintDiv = document.getElementById(`hint-${p.number}`);
                    const expDiv = document.getElementById(`explanation-${p.number}`);
                    const userVal = userSelections[p.number];

                    wrapper.classList.remove('is-correct', 'is-incorrect');
                    hintDiv.classList.remove('visible');
                    expDiv.classList.remove('visible');

                    if (userVal === p.correctHeading) {
                        correctCount++;
                        wrapper.classList.add('is-correct');
                        expDiv.classList.add('visible');
                    } else {
                        wrapper.classList.add('is-incorrect');
                        hintDiv.classList.add('visible');
                        expDiv.classList.add('visible');
                    }
                });

                scoreBox.style.display = 'flex';
                scoreText.textContent = `${correctCount} / ${mountainData.paragraphs.length}`;
            }

            // Hàm hiển thị đáp án và giải thích toàn bộ
            function showAllExplanations() {
                mountainData.paragraphs.forEach(p => {
                    const wrapper = document.getElementById(`select-wrapper-${p.number}`);
                    const triggerText = wrapper.querySelector('.selected-value-text');
                    const hintDiv = document.getElementById(`hint-${p.number}`);
                    const expDiv = document.getElementById(`explanation-${p.number}`);

                    triggerText.textContent = p.correctHeading;
                    wrapper.classList.remove('is-incorrect');
                    wrapper.classList.add('is-correct');
                    hintDiv.classList.remove('visible');
                    expDiv.classList.add('visible');
                    userSelections[p.number] = p.correctHeading;
                });

                scoreBox.style.display = 'flex';
                scoreText.textContent = `7 / 7 (Đã mở đáp án)`;
            }

            // Hàm làm lại
            function resetQuiz() {
                mountainData.paragraphs.forEach(p => {
                    const wrapper = document.getElementById(`select-wrapper-${p.number}`);
                    const triggerText = wrapper.querySelector('.selected-value-text');
                    const hintDiv = document.getElementById(`hint-${p.number}`);
                    const expDiv = document.getElementById(`explanation-${p.number}`);

                    triggerText.textContent = "Choose a heading...";
                    wrapper.classList.remove('is-correct', 'is-incorrect', 'open');
                    wrapper.querySelectorAll('.custom-option').forEach(opt => opt.classList.remove('selected'));
                    hintDiv.classList.remove('visible');
                    expDiv.classList.remove('visible');
                    delete userSelections[p.number];
                });

                scoreBox.style.display = 'none';
                resetTimer();
            }

            checkBtn.addEventListener('click', checkAnswers);
            showExplanationsBtn.addEventListener('click', showAllExplanations);
            resetBtn.addEventListener('click', resetQuiz);

            // --- BỘ ĐẾM GIỜ (08:03 ĐẾM NGƯỢC) ---
            let totalSeconds = 8 * 60 + 3; // 08:03 như ảnh
            let isPaused = false;
            let timerInterval;

            const timerDisplay = document.getElementById('timer-display');
            const pauseBtn = document.getElementById('pause-btn');
            const pauseIcon = document.getElementById('pause-icon');
            const bookmarkBtn = document.getElementById('bookmark-btn');
            const bookmarkIcon = document.getElementById('bookmark-icon');

            function formatTime(sec) {
                const m = Math.floor(sec / 60);
                const s = sec % 60;
                return `00:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }

            function startTimer() {
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    if (!isPaused && totalSeconds > 0) {
                        totalSeconds--;
                        timerDisplay.textContent = formatTime(totalSeconds);
                        if (totalSeconds <= 0) {
                            clearInterval(timerInterval);
                            alert('Hết giờ làm bài!');
                            checkAnswers();
                        }
                    }
                }, 1000);
            }

            function resetTimer() {
                totalSeconds = 8 * 60 + 3;
                isPaused = false;
                pauseIcon.className = 'fas fa-pause';
                timerDisplay.textContent = formatTime(totalSeconds);
                startTimer();
            }

            pauseBtn.addEventListener('click', () => {
                isPaused = !isPaused;
                if (isPaused) {
                    pauseIcon.className = 'fas fa-play';
                } else {
                    pauseIcon.className = 'fas fa-pause';
                }
            });

            bookmarkBtn.addEventListener('click', () => {
                bookmarkBtn.classList.toggle('bookmarked');
                if (bookmarkBtn.classList.contains('bookmarked')) {
                    bookmarkIcon.className = 'fas fa-bookmark';
                } else {
                    bookmarkIcon.className = 'far fa-bookmark';
                }
            });

            startTimer();
        });
    </script>
</body>
</html>
